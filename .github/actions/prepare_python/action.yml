name: "Prepare Python"
description: "Python ランタイムと依存パッケージをインストールし、Python バージョンを出力する"

inputs:
  dependency-group:
    description: "uv の依存パッケージインストール時に指定するグループ"
    required: false

runs:
  using: "composite"
  steps:
    - name: <Setup> Install uv
      uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      with:
        activate-environment: true

    - name: <Setup> Install Python dependencies
      run: |
        args=()
        if [[ -n "${{ inputs.dependency-group }}" ]]; then
          args+=(--group "${{ inputs.dependency-group }}")
        fi

        # NOTE: macOSでインストールするwheelのバージョンを制限する
        # `MACOSX_DEPLOYMENT_TARGET`だけではランナーのmacOS向けwheelが選ばれるため、`--python-platform`も指定する
        case "$RUNNER_OS,$RUNNER_ARCH" in
          macOS,X64)
            args+=(--python-platform x86_64-apple-darwin)
            export MACOSX_DEPLOYMENT_TARGET="13.0"
            ;;
          macOS,ARM64)
            args+=(--python-platform aarch64-apple-darwin)
            export MACOSX_DEPLOYMENT_TARGET="13.0"
            ;;
        esac

        uv sync "${args[@]}"
      shell: bash
